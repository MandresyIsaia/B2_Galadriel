  <main class="gc-content" aria-label="Accueil">
    <section class="gc-login" aria-label="Identification">
      <h1 class="gc-title">Gondor Chic</h1>

      <form
        class="gc-form"
        (submit)="onSubmit($event, pseudo.value, password.value)"
        autocomplete="off"
      >
        <label class="gc-field">
          <span class="gc-label">Pseudo</span>
          <input
            class="gc-input"
            type="text"
            name="pseudo"
            placeholder="Votre pseudo unique"
            autocomplete="username"
            inputmode="text"
            #pseudo
          />
        </label>

        <label class="gc-field">
          <span class="gc-label">Mot de passe</span>
          <input
            class="gc-input"
            type="password"
            name="password"
            placeholder="Votre mot de passe secret"
            autocomplete="current-password"
            #password
          />
        </label>

        <button class="gc-button" type="submit">S’identifier</button>
      </form>
    </section>
  </main>
</div>
