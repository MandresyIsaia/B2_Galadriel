<main class="login-page" aria-label="Connexion Gondor Chic">
  <section class="login-panel" aria-label="Identification">
    <img class="login-logo" src="/assets/img/logo-login.svg" alt="Logo Gondor Chic" />

    <h1>Gondor Chic</h1>

    <form
      class="login-form"
      (submit)="onSubmit($event, pseudo.value, password.value)"
      autocomplete="off"
    >
      <label class="input-group" for="pseudo">
        <span>Pseudo</span>
        <input
          type="text"
          id="pseudo"
          name="pseudo"
          placeholder="Votre pseudo unique"
          autocomplete="username"
          #pseudo
        />
      </label>

      <label class="input-group" for="password">
        <span>Mot de passe</span>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Votre mot de passe secret"
          autocomplete="current-password"
          #password
        />
      </label>

      <button type="submit">S'identifier</button>
    </form>
  </section>
</main>
