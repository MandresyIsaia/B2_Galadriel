<div class="gondor-container">
  <header class="gondor-header">
    <img src="/assets/img/logo-login.svg" alt="Logo Gondor Chic" class="gondor-logo">

    <h1 class="brand-title">Gondor Chic</h1>

    <h2 class="welcome-text">
      <span class="welcome">Bienvenue,</span>
      {{ client.prenom }} {{ client.nom }}
    </h2>
  </header>

  <main class="product-card">
    <div class="badge-produit-jour">
      Le produit du jour
    </div>
    @if (produit(); as p) {
      <div class="product-content">
        <div class="product-image-container">
          <img
            [src]="p.image"
            [alt]="p.imageAlt"
            class="product-image"
          >
        </div>

        <div class="product-details">
          <h3 class="product-name">
            {{ p.nom }}
          </h3>

          <div class="info-row">
            <div class="info-box">
              <span class="box-label">Prix</span>

              <div class="box-value price-value">
                <img src="/assets/img/piece.png" alt="Piece" class="coin-icon">
                <span class="price-text">
                  <span class="price-number">{{ p.prix }}</span>
                  <span class="price-currency">€</span>
                </span>
              </div>
            </div>

            <div class="info-box">
              <span class="box-label">En stock</span>

              <div class="box-value stock-value">
                <span class="checkmark-icon" aria-hidden="true">✓</span>
                <span class="stock-text">
                  <span class="stock-number">{{ p.stock }}</span>
                  <span class="stock-unit">PIÈCE</span>
                </span>
              </div>
            </div>
          </div>

          <div class="quantity-section">
            <span class="box-label">Quantité</span>

            <div class="quantity-selector">
              <button
                type="button"
                class="qty-btn"
                aria-label="Diminuer la quantité"
                [disabled]="quantite <= 1"
                (click)="decrementer()"
              >
                -
              </button>

              <input
                type="number"
                class="qty-input"
                min="1"
                [max]="p.stock"
                [value]="quantite"
                aria-label="Quantité"
                (input)="changerQuantite($any($event.target).value)"
              >

              <button
                type="button"
                class="qty-btn"
                aria-label="Augmenter la quantité"
                [disabled]="quantite >= p.stock"
                (click)="incrementer()"
              >
                +
              </button>
            </div>

            <button type="button" class="btn-add-to-cart" (click)="ajouterAuPanier()">
              Ajouter au panier
            </button>
          </div>
        </div>
      </div>
    }
  </main>
</div>
